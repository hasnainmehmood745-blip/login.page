<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION FORM</title>
</head>
<body bgcolor="#2568054">
<center>
   
    <h1><b><hr>Registration Form<hr></b></h1>
    <table border="1px">
    <form>
        <tr>
           <th>Enter your first name</th>
           <td><input type="text" placeholder="Enter your first name"></td>
        </tr>

        <tr>
            <th><b>Enter your Last name</b></th>
            <td><input placeholder="Enter your Last name" type="text"></td>
        </tr>

        <tr>
            <th><b>Enter your E-mail</b></th>
            <td><input type="text" placeholder="Enter your E-mail"></td>
        </tr>

        <tr>
            <th><b>Enter your Password</b></th>
            <td><input placeholder="Enter your password" type="text"></td>
        </tr>

        <tr>
            <th><b>Re-enter your Password</b></th>
            <td><input placeholder="Re-enter your password" type="text"></td>
        </tr>
        
        <tr>
            <th><b>Enter your Number</b></th>
            <td><input placeholder="Enter your number" type="text"></td>
        </tr>

        <tr>
            <th><b>Enter your Address</b></th>
            <td><textarea placeholder="Enter your Address"></textarea></td>
        </tr>
            <th><b>Select your gender</b></th>
            <td>
                <input type="radio" name="gender" id="male"><label for="male">Male</label>
                <input type="radio" name="gender" id="female"><label for="female">Female</label>
            </td>
        </tr>
        <tr>
            <th>Select your Hobbies</th>
            <td>
                <input type="radio" name="gender" id="Circket"><label for="circket">Circket</label>
                <input type="radio" name="gender" id="Foot Ball"><label for="football">Foot Ball</label>
                <input type="radio" name="gender" id="Bat-Minton"><label for="bat-minto">Bat-Minton</label>
            </td>
        </tr>
        <tr>
            <th>Select your DOB</th>
            <td><input type="date"></td>
        </tr>
        <tr>
            <th>Select your country</th>
            <td>
                <select>
                    <option selected disabled>select your country</option>
                    <option>Pakistan</option>
                    <option>AFGHANISTAN</option>
                    <option>MALAYSIA</option>
                    <option>UNITED ARAB</option>
                    <option>YEMEN</option>
                    <option>TURKEY</option>
                    <option>LIBYA</option>
                    <option>IRAQ</option>
                    <option>IRAN</option>
                    <option>SAUDI ARABIA</option>
                    <option>OMAN</option>
                    <option>PALESTINE</option>
                    <option>QATAR</option>
                    <option>EGYPT</option>
                </select>
            </td>
        </tr>
        <tr>
            <th>Selected your Picture</th>
            <td><input type="file"></td>
        </tr>
        <tr>
            <td align="center"><input type="Submit" value="Submit" class="button"></td>
            <td align="center"><input type="Reset" value="Reset" class="button"></td>
        </tr>
    </table>
   </form>
</center>
</body>
</html>
