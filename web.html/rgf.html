    <center>
        <h3>Registration form</h3>
        <table border="1px">


            <form>


                <tr>
                    <th>Enter your first name</th>
                    <td><input type="text" placeholder="enter your first name"></td>
                </tr>

                <tr>
                    <th>Enter your last name</th>
                    <td><input type="text" placeholder="enter your last name"></td>
                </tr>

                <tr>
                    <th>Enter your password</th>
                    <td><input type="text" placeholder="enter your password"></td>
                </tr>

                <tr>
                    <th>Re-nter your password</th>
                    <td><input type="password" placeholder="renter your password"></td>
                </tr>

                <tr>
                    <th>Enter your email</th>
                    <td><input type="email" placeholder="enter your email"></td>
                </tr>

                <tr>
                    <th>Enter your mobile</th>
                    <td><input type="text" placeholder="enter your mobile"></td>
                </tr>

                <tr>
                    <th>Enter your address</th>
                    <td><textarea placeholder="enter your address"></textarea></td>
                </tr>

                <tr>
                    <th>select your gender</th>
                    <td>
                        <label for="male">male</label><input type="radio" name="gender" id="male">
                        <label for="female">female</label><input type="radio" name="gender" id="female">
                    </td>
                </tr>

                <tr>
                    <th>select your hobbies</th>
                    <td>
                        <label for="hobby1">hobby1</label><input type="checkbox" id="hobby1">
                        <label for="hobby2">hobby2</label><input type="checkbox" id="hobby2">
                        <label for="hobby3">hobby3</label><input type="checkbox" id="hobby3">
                    </td>
                </tr>

                <tr>
                    <th>select your DOB</th>
                    <td><input type="date"></td>
                </tr>

                <tr>
                    <th>select your country</th>
                    <td>
                        <select>
                            <option selected disabled>select your country</option>
                            <option>pakistan</option>
                            <option>china</option>
                            <option>india</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <th>upload your pic</th>
                    <td><input type="file"></td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <button>save my data</button>
                        <input type="reset" value="reset">
                    </td>
                </tr>



            </form>



        </table>
    </center>
